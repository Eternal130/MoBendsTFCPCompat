name: Release

# Build and publish a GitHub Release whenever a version tag is pushed.
# Tags follow the pattern `v<version>` (e.g. `v1.0.0`); the leading `v` is
# stripped to form the release name and the artifact version comes from
# `git describe` via the GTNH convention plugin (palantir git-version).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      # Full history (fetch-tags) is required: the GTNH version plugin runs
      # `git describe` over the tag history to compute the mod version.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JDK 25 is pinned by gradle-daemon-jvm.properties (the Gradle daemon
      # toolchain). enableModernJavaSyntax=false downgrades to Java 8 bytecode
      # at compile time, so the output jar stays 1.7.10-compatible.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # setupDecompWorkspace downloads the deobf MCP mappings used by RFG.
      # Both Mo'Bends and TFC+ dev jars are committed under libs/, so no
      # external auth or secret is needed to build.
      - name: Build
        run: |
          ./gradlew setupDecompWorkspace --no-daemon
          ./gradlew build --no-daemon

      # ${GITHUB_REF_NAME} is the tag name (e.g. `v1.0.0`); strip the leading
      # `v` to get the bare version for matching the jar name.
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobends_tfcp_compat-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish a GitHub Release attached to the pushed tag, with the built
      # jar attached. draft:false lets users grab it immediately.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
